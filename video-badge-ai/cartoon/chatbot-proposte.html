<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Chatbot · tre proposte</title>
<style>
  @font-face { font-family: "EB Garamond"; font-weight: 700; src: url(fonts/eb-garamond-latin-700-normal.woff2); }
  @font-face { font-family: "Inter"; font-weight: 400; src: url(fonts/inter-latin-400-normal.woff2); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url(fonts/inter-latin-600-normal.woff2); }
  @font-face { font-family: "Inter"; font-weight: 800; src: url(fonts/inter-latin-800-normal.woff2); }
  * { margin: 0; box-sizing: border-box; }
  body { width: 2400px; background: #efe6d6; color: #1c2230; font-family: Inter; padding: 60px 80px 70px;
         background-image: radial-gradient(#d9ccb5 1.2px, transparent 1.2px); background-size: 28px 28px; }
  h1 { font-family: "EB Garamond"; font-size: 76px; line-height: 1; }
  .sub { font-size: 24px; color: #5d5a52; margin-top: 12px; }
  .kicker { font-weight: 800; font-size: 18px; letter-spacing: .16em; text-transform: uppercase; color: #9a3f17; }
  .row { display: flex; gap: 30px; margin-top: 36px; }
  .card { flex: 1; background: #f8f3ea; border-radius: 18px; padding: 26px 26px 20px; box-shadow: 0 2px 0 #d6c8ae, 0 18px 40px rgba(60,40,10,.12); }
  .card.rec { outline: 6px solid #b5562a; }
  .card h2 { font-family: "EB Garamond"; font-size: 46px; margin: 6px 0 6px; }
  .card p { font-size: 20px; color: #5d5a52; line-height: 1.4; min-height: 112px; }
  .lab { font-weight: 800; font-size: 16px; letter-spacing: .12em; text-transform: uppercase; color: #3a3d45; margin: 22px 0 0; }
  svg { display: block; overflow: visible; }
</style>
<script src="characters.js"></script><script src="chatbots.js"></script>
</head>
<body>
  <div class="kicker">Sono un contratto · i due chatbot · tre direzioni</div>
  <h1>Via la forma squadrata: tre proposte</h1>
  <div class="sub">In ogni proposta: ChatGratis (il chatbot trovato online) e l'Assistente aziendale, mentre escono dal portatile.</div>
  <div class="row" id="row"></div>
<script>
const { P } = Chars, B = Chatbots;
// portatile semplice: coperchio con schermo colorato + base; il personaggio "esce" dallo schermo
const laptop = (scr) => `<g><path d="M-170,0 L170,0 Q182,0 182,12 L182,190 L-182,190 L-182,12 Q-182,0 -170,0Z" fill="#3b4658" stroke="${P.ink}" stroke-width="5"/>
  <rect x="-166" y="14" width="332" height="164" rx="6" fill="${scr}"/><ellipse cx="0" cy="96" rx="140" ry="62" fill="#fff" opacity=".35"/>
  <path d="M-230,190 L230,190 L262,222 L-262,222Z" fill="#56637a" stroke="${P.ink}" stroke-width="5" stroke-linejoin="round"/></g>`;
const scene = (char, scr, lift, s) => `<svg width="660" height="600" viewBox="-330 -480 660 600">
  <g transform="translate(0,-110)">${laptop(scr)}</g>
  <g transform="translate(0,${lift}) scale(${s})">${char}</g></svg>`;
const OPT = [
  ["1", "Nuvoletta", "Un balloon da fumetto morbido e tondeggiante. ChatGratis è una nuvola gonfia e un po' sbruffona; l'Assistente un ovale pulito. Esce dallo schermo con un \"pop\", come un fumetto che appare.",
   scene(B.cloudGratis(), "#ffe27a", -60, 0.92), scene(B.cloudAssist(), "#d3ece7", -60, 0.92), false],
  ["2", "Genio digitale", "Un genio fatto di fumo che esce dal computer come dalla lampada: la coda resta attaccata allo schermo. ChatGratis è il genio che \"regala\" desideri (troppo bello per essere vero); l'Assistente è un genio in ordine, con papillon e lucchetto.",
   scene(B.genieGratis(), "#ffe27a", -60, 0.88), scene(B.genieAssist(), "#d3ece7", -60, 0.88), true],
  ["3", "Capsula con antenna", "Un robottino a pillola, morbido, con antenna e i tre puntini \"sta scrivendo\". ChatGratis ha la stella luccicante sull'antenna; l'Assistente ha un lucchetto. Il più \"tecnologico\" dei tre.",
   scene(B.capsuleGratis(), "#ffe27a", -60, 0.9), scene(B.capsuleAssist(), "#d3ece7", -60, 0.9), false],
];
document.getElementById("row").innerHTML = OPT.map(([k, n, d, g, a, rec]) => `<div class="card${rec ? " rec" : ""}">
  <div class="kicker">Proposta ${k}${rec ? " · consigliata" : ""}</div><h2>${n}</h2><p>${d}</p>
  <div class="lab">ChatGratis</div>${g}<div class="lab">Assistente aziendale</div>${a}</div>`).join("");
</script>
</body>
</html>
